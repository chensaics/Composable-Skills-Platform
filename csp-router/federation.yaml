# CSP Federation Registry — 联邦路由注册表
# 
# 本文件定义 CSP 联邦体系中的所有子包（package），每个子包可独立安装。
# csp-router 作为联邦路由层，根据用户意图自动探测 → 路由到对应子包 → 
# 子包缺失时提示安装。

version: "1.0.0"
federation_version: "0.1.0"

# ── 联邦路由规则 ──────────────────────────────────────────────
routing:
  # 策略：先本地 skills 匹配（L0→L4），无匹配时查 federation
  strategy: local_first_then_federal
  # 子包未安装时的行为
  on_missing_package:
    action: suggest_install  # 提示用户安装，不静默跳过
    message_template: >
      🔍 检测到你的任务属于 {package_name} 领域（{domain}），但你还没有安装它。
      
      一键安装：{install_command}
      
      这个包包含 {skill_count} 个技能，覆盖 {domains}。
      安装后我会自动路由到对应的 skill。

# ── 联邦子包注册 ──────────────────────────────────────────────
packages:
  # ── Core: 编程全链路（当前 CSP 本体）──
  - id: csp-core
    name: "CSP Core — 编程全链路"
    description: "从需求到上线的完整编程技能体系：设计/规划/开发/测试/发布"
    package_name: "@csp/core"        # npm 包名（未来）
    repo: "maythyai/code-skills-package"  # GitHub 仓库
    install_commands:
      npx: "npx skills add maythyai/code-skills-package"
      claude: "/plugin marketplace add maythyai/code-skills-package"
      manual: "git clone https://github.com/maythyai/code-skills-package.git"

    # 领域触发词
    domains:
      programming:
        keywords: ["代码", "开发", "编程", "debug", "TDD", "API", "数据库", "前端", "后端"]
        weight: 100  # core 是默认包，权重最高
      devops:
        keywords: ["部署", "CI/CD", "K8s", "Docker", "服务器", "运维"]
        weight: 80
      architecture:
        keywords: ["架构", "设计模式", "系统设计", "微服务", "重构"]
        weight: 70

    # 内部五层结构（给联邦路由参考，不改变内部路由逻辑）
    layers:
      - name: "L0 Router"
        path: "csp-router/"
        description: "任务分类 + skill 自动路由"
      - name: "L1 Methodology"
        path: "csp-meta/"
        description: "方法论：brainstorming, TDD, debugging, spec-driven"
      - name: "L2 Workflow"
        path: "csp-workflow/"
        description: "项目生命周期：plan → execute → verify → ship"
      - name: "L3 Patterns"
        path: "csp-patterns/"
        description: "语言/框架模式、reviewers、build-resolvers"
      - name: "L4 Runtime"
        path: "csp-runtime/"
        description: "运行时：autopilot, wiki, remember, self-improve"

    skill_count: 716
    token_budget: ~2000

  # ── Creator: 创作者工具 ──
  - id: csp-creator
    name: "CSP Creator — AI 创作者工具箱"
    description: "短视频/自媒体/图片生成/内容策略：从创意到发布的完整创作技能"
    package_name: "@csp/creator"
    repo: "maythyai/csp-creator"
    install_commands:
      npx: "npx skills add maythyai/csp-creator"
      claude: "/plugin marketplace add maythyai/csp-creator"
      manual: "git clone https://github.com/maythyai/csp-creator.git"

    domains:
      video:
        keywords: ["短视频", "剪辑", "视频", "抖音", "TikTok", "YouTube", "B站", "拍摄", "字幕", "配音", "转场", "Shorts", "Reels"]
        weight: 90
      image:
        keywords: ["图片", "生成图片", "AI绘画", "Midjourney", "Stable Diffusion", "DALL-E", "海报", "封面", "修图", "P图"]
        weight: 85
      social_media:
