# CSP Federation Registry — 联邦路由注册表 v0.2.0
#
# 本文件定义 CSP 联邦体系中的所有子包，每个子包可独立安装。
# csp-router 作为联邦路由层，根据用户意图自动探测 → 路由到对应子包 →
# 子包缺失时提示安装。
#
# 核心设计原则：
#   CSP skills 是"链接器"(Connector)，不是"构建器"(Builder)。
#   - ✅ 通过 Notion API 同步知识库条目
#   - ❌ 构建一个 Notion 克隆
#   - ✅ 通过 WeCom API 发送企业微信消息
#   - ❌ 构建一个企业微信客户端
#   - ✅ 通过 Stripe API 管理订阅
#   - ❌ 构建一个支付网关

version: "1.0.0"
federation_version: "0.2.0"

# ── 联邦路由规则 ──────────────────────────────────────────────
routing:
  strategy: local_first_then_federal
  on_missing_package:
    action: suggest_install
    message_template: >
      🔍 检测到你的任务属于 {name} 领域。

      一键安装：{install_command}

      包含 {skill_count} 个技能，覆盖 {domains}。
      安装后自动路由到对应 skill。

# ── 联邦子包注册（12 包）──────────────────────────────────────
packages:

  # ── 1. Meta: Agent 自进化引擎（必装基座）──
  - id: csp-meta
    name: "CSP Meta · Agent 自进化"
    description: "路由器 + 生命周期编排 + 技能蒸馏 + 联邦路由。所有子包的共同基座，安装任一子包时自动安装。"
    package_name: "@csp/meta"
    repo: "maythyai/code-skills-package"
    auto_install: true
    install_commands:
      npx: "npx skills add maythyai/code-skills-package"
      claude: "/plugin marketplace add maythyai/code-skills-package"
    domains:
      meta:  { keywords: ["路由", "编排", "lifecycle", "蒸馏", "distill", "联邦"], weight: 50 }
    skill_count: 8
    token_budget: ~2000

  # ── 2. Code: 代码开发 ──
  - id: csp-code
    name: "CSP Code · 代码开发"
    description: "全栈编程：语言模式、框架、API 设计、后端、前端、移动端。Skills 链接 VS Code/JetBrains/Git 等开发工具。"
    package_name: "@csp/code"
    repo: "maythyai/code-skills-package"
    install_commands:
      npx: "npx skills add maythyai/code-skills-package"
      claude: "/plugin marketplace add maythyai/code-skills-package"
    domains:
      programming: { keywords: ["代码","开发","编程","Python","JavaScript","TypeScript","Go","Rust","Java","React","Vue","Next.js","FastAPI","API设计","后端","前端","移动端","iOS","Android"], weight: 100 }
      architecture: { keywords: ["架构","设计模式","系统设计","微服务","DDD","重构"], weight: 70 }
      deps: ["csp-meta"]

    layers:
      - { name: "L1 方法论", path: "csp-meta/", desc: "TDD, debugging, brainstorming" }
      - { name: "L2 工作流", path: "csp-workflow/", desc: "plan → execute → verify → ship" }
      - { name: "L3 模式", path: "csp-patterns/", desc: "语言/框架/DB 模式, reviewers, build" }
      - { name: "L4 运行时", path: "csp-runtime/", desc: "autopilot, wiki, self-improve" }

    skill_count: 550
    token_budget: ~1800

  # ── 3. Quality: 测试与安全 + 代码评审 ──
  - id: csp-quality
    name: "CSP Quality · 测试与安全"
    description: "测试(单测/集成/E2E/性能) + 安全(审计/渗透/合规) + 代码评审(CR/编码规范/技术债)。Skills 链接 SonarQube/Snyk/CI 等质量工具。"
    package_name: "@csp/quality"
    repo: "maythyai/csp-quality"
    install_commands:
      npx: "npx skills add maythyai/csp-quality"
      claude: "/plugin marketplace add maythyai/csp-quality"
    domains:
      testing:   { keywords: ["测试","单测","集成测试","E2E","pytest","vitest","Playwright","Cypress","覆盖率","TDD","pairwise","模糊测试","性能测试","QA"], weight: 90 }
      security:  { keywords: ["安全","漏洞","渗透","注入","XSS","CSRF","加密","认证","SonarQube","Snyk","CodeQL","依赖扫描","STRIDE"], weight: 85 }
      code_review:{ keywords: ["代码评审","CR","Code Review","编码规范","命名规范","lint","ruff","技术债","重构"], weight: 80 }
    deps: ["csp-meta"]
    skill_count: 0
    token_budget: ~600

  # ── 4. DevOps: 运维部署 + 开发者工具 ──
  - id: csp-devops
    name: "CSP DevOps · 运维部署"
    description: "CI/CD、容器/K8s、云部署、监控告警、开发者工具。Skills 链接 GitHub Actions/Docker/K8s/AWS/GCP/阿里云。"
    package_name: "@csp/devops"
    repo: "maythyai/csp-devops"
    install_commands:
      npx: "npx skills add maythyai/csp-devops"
      claude: "/plugin marketplace add maythyai/csp-devops"
    domains:
      cicd:       { keywords: ["CI/CD","GitHub Actions","Jenkins","部署","发布","构建","pipeline"], weight: 90 }
      cloud:      { keywords: ["容器","Docker","K8s","Kubernetes","云部署","AWS","GCP","Azure","阿里云","Vercel","Railway"], weight: 85 }
      monitoring: { keywords: ["监控","告警","日志","Prometheus","Grafana","Datadog","可观测","trace"], weight: 75 }
      devtools:   { keywords: ["Git","GitHub","CLI","Shell","Bash","IDE","VS Code","JetBrains","插件","环境变量"], weight: 70 }
    deps: ["csp-meta"]
    skill_count: 0
    token_budget: ~500

  # ── 5. Data: 数据分析 + 数据库 ──
  - id: csp-data
    name: "CSP Data · 数据分析"
    description: "数据科学/SQL/BI/可视化/数据工程。Skills 链接 BigQuery/Tableau/dbt/Superset 等数据工具。"
    package_name: "@csp/data"
    repo: "maythyai/csp-data"
    install_commands:
      npx: "npx skills add maythyai/csp-data"
      claude: "/plugin marketplace add maythyai/csp-data"
    domains:
      data_science: { keywords: ["数据科学","机器学习","特征工程","pandas","scikit-learn","预测","分类","聚类"], weight: 85 }
      sql:          { keywords: ["SQL","查询","PostgreSQL","MySQL","BigQuery","ClickHouse","窗口函数","JOIN","索引"], weight: 85 }
      visualization:{ keywords: ["可视化","图表","仪表盘","Tableau","Metabase","Superset","ECharts","D3","Plotly","BI"], weight: 75 }
      data_eng:     { keywords: ["数据工程","ETL","数据管道","数据仓库","Airflow","dbt","Spark"], weight: 70 }
    deps: ["csp-meta"]
    skill_count: 0
    token_budget: ~500

  # ── 6. Design: 视觉设计 ──
  - id: csp-design
    name: "CSP Design · 视觉设计"
    description: "UI/UX、品牌、印刷、3D、动效。Skills 链接 Figma/Canva/Spline/Framer 等设计工具。"
    package_name: "@csp/design"
    repo: "maythyai/csp-design"
    install_commands:
      npx: "npx skills add maythyai/csp-design"
      claude: "/plugin marketplace add maythyai/csp-design"
    domains:
      ui_ux:  { keywords: ["UI设计","UX设计","原型","线框","Figma","Sketch","交互设计","用户研究"], weight: 85 }
      brand:  { keywords: ["品牌","Logo","VI","视觉识别","品牌手册","色彩","设计系统"], weight: 80 }
      graphic:{ keywords: ["海报","Canva","排版","印刷","包装","名片","画册"], weight: 70 }
      three_d:{ keywords: ["3D","Blender","Spline","渲染","动画","C4D"], weight: 55 }
    deps: ["csp-meta"]
    skill_count: 0
    token_budget: ~400

  # ── 7. Creator: 内容创作 ──
  - id: csp-creator
    name: "CSP Creator · 内容创作"
    description: "短视频/写作/自媒体/播客/图片生成。Skills 链接 TikTok/YouTube/Substack/Canva/Midjourney/剪映 等内容平台和工具。"
    package_name: "@csp/creator"
    repo: "maythyai/csp-creator"
    install_commands:
      npx: "npx skills add maythyai/csp-creator"
      claude: "/plugin marketplace add maythyai/csp-creator"
    domains:
      video:    { keywords: ["短视频","抖音","TikTok","YouTube","Shorts","Reels","B站","剪辑","字幕","CapCut","剪映"], weight: 90 }
      writing:  { keywords: ["写作","公众号","博客","Substack","Newsletter","文案","翻译","专栏"], weight: 85 }
      social:   { keywords: ["自媒体","小红书","微博","Instagram","内容运营","涨粉","爆款"], weight: 80 }
      image:    { keywords: ["图片生成","AI绘画","Midjourney","Stable Diffusion","DALL-E","海报","封面"], weight: 80 }
      audio:    { keywords: ["播客","Podcast","音频","录音","配音","混音"], weight: 60 }
    deps: ["csp-meta"]
    skill_count: 1
    token_budget: ~500

  # ── 8. Automation: 工具与自动化 ──
  - id: csp-automation
    name: "CSP Automation · 工具与自动化"
    description: "无代码自动化/工作流/webhook/定时任务/爬虫。Skills 链接 Zapier/n8n/Make/WeCom/飞书/钉钉 等自动化平台。"
    package_name: "@csp/automation"
    repo: "maythyai/csp-automation"
    install_commands:
      npx: "npx skills add maythyai/csp-automation"
      claude: "/plugin marketplace add maythyai/csp-automation"
    domains:
      no_code:   { keywords: ["无代码","自动化","Zapier","n8n","Make","IFTTT"], weight: 85 }
      workflow:  { keywords: ["工作流","编排","审批","触发器","条件判断"], weight: 80 }
      webhook:   { keywords: ["webhook","API集成","数据同步","Slack","钉钉","飞书","WeCom","企业微信"], weight: 80 }
      scheduler: { keywords: ["定时任务","cron","调度","批量处理","轮询"], weight: 75 }
      scraping:  { keywords: ["爬虫","抓取","数据采集","BeautifulSoup","Puppeteer","Scrapy","RSS"], weight: 70 }
    deps: ["csp-meta"]
    skill_count: 0
    token_budget: ~500

  # ── 9. Business: 市场商业 ──
  - id: csp-business
    name: "CSP Business · 市场商业"
    description: "市场营销/电商零售/金融财务/销售运营/CRM。Skills 链接 Stripe/GA4/Shopify/Mailchimp 等商业工具。"
    package_name: "@csp/business"
    repo: "maythyai/csp-business"
    install_commands:
      npx: "npx skills add maythyai/csp-business"
      claude: "/plugin marketplace add maythyai/csp-business"
    domains:
      marketing:  { keywords: ["营销","推广","SEO","SEM","广告","投放","获客","增长","裂变","私域","GA4","Mailchimp"], weight: 90 }
      ecommerce:  { keywords: ["电商","Shopify","淘宝","京东","拼多多","TikTok Shop","独立站","选品","Listing"], weight: 80 }
      sales:      { keywords: ["销售","CRM","客户","漏斗","转化","线索","跟进","话术","HubSpot","Salesforce"], weight: 80 }
      finance:    { keywords: ["记账","预算","理财","报税","发票","Stripe","LeamonSqueezy","订阅","Paddle"], weight: 75 }
    deps: ["csp-meta"]
    skill_count: 1
    token_budget: ~600

  # ── 10. Product: 产品管理 ──
  - id: csp-product
    name: "CSP Product · 产品管理"
    description: "PRD/路线图/Spec/需求拆解/产品说明书。Skills 链接 Notion/Linear/Jira/Figma 等产品管理工具。"
    package_name: "@csp/product"
    repo: "maythyai/csp-product"
    install_commands:
      npx: "npx skills add maythyai/csp-product"
      claude: "/plugin marketplace add maythyai/csp-product"
    domains:
      prd:          { keywords: ["PRD","产品需求","需求文档","写需求","产品需求文档"], weight: 90 }
      roadmap:      { keywords: ["路线图","roadmap","版本规划","产品规划","战略"], weight: 85 }
      spec:         { keywords: ["Spec","技术规格","contract","契约","FR","AC","验收标准"], weight: 85 }
      decomposition:{ keywords: ["需求拆解","需求分析","用户故事","user story","功能清单"], weight: 80 }
    deps: ["csp-meta"]
    skill_count: 0
    token_budget: ~600

  # ── 11. Workspace: 工作套件 + 效率工具 ──
  - id: csp-workspace
    name: "CSP Workspace · 工作套件"
    description: "项目管理/知识库/文档协同/IM集成/效率工具。Skills 链接 Notion/Obsidian/Linear/飞书/微信/GitHub 等工作平台（不构建它们，只做集成）。"
    package_name: "@csp/workspace"
    repo: "maythyai/csp-workspace"
    install_commands:
      npx: "npx skills add maythyai/csp-workspace"
      claude: "/plugin marketplace add maythyai/csp-workspace"
    domains:
      knowledge: { keywords: ["知识库","Notion","Obsidian","wiki","文档","笔记","第二大脑","知识管理"], weight: 90 }
      project:   { keywords: ["项目管理","Linear","Jira","Trello","Asana","任务","OKR","甘特图"], weight: 85 }
      im:        { keywords: ["IM集成","飞书","企业微信","WeCom","钉钉","Slack","Teams","消息推送"], weight: 80 }
      productivity:{ keywords: ["效率","GTD","番茄钟","日程","日历","待办","习惯","Todoist","Things"], weight: 75 }
      collab:    { keywords: ["协作","共享","团队","多人编辑","批注","审批"], weight: 70 }
    deps: ["csp-meta"]
    skill_count: 0
    token_budget: ~500

  # ── 12. Other: 其他（兜底）──
  - id: csp-other
    name: "CSP Other · 其他"
    description: "教育/科研/法律/生活/健康/旅行等未归类技能。Skills 链接各领域专业工具。"
    package_name: "@csp/other"
    repo: "maythyai/csp-other"
    install_commands:
      npx: "npx skills add maythyai/csp-other"
      claude: "/plugin marketplace add maythyai/csp-other"
    domains:
      education: { keywords: ["教育","课程","教学","MOOC","辅导","考试","知识图谱"], weight: 70 }
      research:  { keywords: ["科研","论文","文献","实验","PubMed","arXiv","Zotero"], weight: 65 }
      legal:     { keywords: ["法律","合同","NDA","隐私政策","合规","GDPR","商标","版权"], weight: 60 }
      life:      { keywords: ["旅行","健身","健康","饮食","家居","装修"], weight: 55 }
    deps: ["csp-meta"]
    skill_count: 0
    token_budget: ~400

# ── 联邦路由决策矩阵 ──────────────────────────────────────────
decision_matrix:
  resolution:
    # 精确匹配优先 — 明确的产品名直接路由（Skills 是 Connector 不是 Builder）
    - when: "programming domain > 0.7"
      route_to: "csp-code"
    - when: "testing + security + code_review domain > 0.5"
      route_to: "csp-quality"
    - when: "cicd + cloud + monitoring domain > 0.5"
      route_to: "csp-devops"
    - when: "data_science + sql + visualization domain > 0.5"
      route_to: "csp-data"
    - when: "ui_ux + brand + graphic domain > 0.5"
      route_to: "csp-design"
    - when: "video + writing + social + audio domain > 0.5"
      route_to: "csp-creator"
    - when: "no_code + workflow + webhook domain > 0.5"
      route_to: "csp-automation"
    - when: "marketing + ecommerce + sales + finance domain > 0.5"
      route_to: "csp-business"
    - when: "prd + roadmap + spec domain > 0.5"
      route_to: "csp-product"
    - when: "knowledge + project + im + productivity domain > 0.5"
      route_to: "csp-workspace"
    - when: "education + research + legal + life domain > 0.4"
      route_to: "csp-other"
    # 兜底
    - when: "multiple domains > 0.3 each"
      route_to: "ask_user"
    - when: "no domain > 0.3"
      route_to: "csp-code"

# ── 跨包能力发现 ──────────────────────────────────────────────
capability_discovery:
  cross_suggest:
    - { from: "csp-code", triggers: ["SEO","推广","变现"], suggest: "csp-business" }
    - { from: "csp-code", triggers: ["短视频","封面","海报"], suggest: "csp-creator" }
    - { from: "csp-code", triggers: ["PRD","需求文档"], suggest: "csp-product" }
    - { from: "csp-code", triggers: ["CI/CD","部署","K8s"], suggest: "csp-devops" }
    - { from: "csp-code", triggers: ["安全","漏洞","渗透"], suggest: "csp-quality" }
    - { from: "csp-business", triggers: ["自动化脚本","API"], suggest: "csp-code" }
    - { from: "csp-creator", triggers: ["Notion","飞书","自动化"], suggest: "csp-workspace" }
    - { from: "csp-product", triggers: ["技术方案","接口"], suggest: "csp-code" }

# ── 版本兼容性 ────────────────────────────────────────────────
compatibility:
  min_router_version: "1.0.0"
  # csp-meta 是所有包的唯一依赖。其他包之间无依赖。
  package_dependencies:
    csp-meta:       []
    csp-code:       ["csp-meta"]
    csp-quality:    ["csp-meta"]
    csp-devops:     ["csp-meta"]
    csp-data:       ["csp-meta"]
    csp-design:     ["csp-meta"]
    csp-creator:    ["csp-meta"]
    csp-automation: ["csp-meta"]
    csp-business:   ["csp-meta"]
    csp-product:    ["csp-meta"]
    csp-workspace:  ["csp-meta"]
    csp-other:      ["csp-meta"]