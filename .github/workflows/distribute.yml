name: Distribute CSP

on:
  push:
    tags: ["v*"]           # version tags trigger distribution
  workflow_dispatch:        # manual trigger

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/validate-skill-v3.mjs csp-*/skills/
      - run: npm run validate:all
      - run: npm run build:all
      - run: npm test

  deploy-website:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: "website/" }
      - id: deploy
        uses: actions/deploy-pages@v4

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm publish
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  publish-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            install.sh
            install.ps1
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  update-install-stats:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update install stats badge
        run: |
          npm_dl=$(curl -s "https://api.npmjs.org/downloads/point/last-month/code-skills-package" | jq '.downloads // 0')
          gh_dl=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/maythyai/code-skills-package/releases" | \
            jq '[.[].assets[].download_count] | add // 0')
          echo "NPM downloads: $npm_dl"
          echo "GitHub downloads: $gh_dl"